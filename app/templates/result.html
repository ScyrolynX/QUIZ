{% extends "base.html" %}
{% block title %}Results{% endblock %}
{% block content %}
  <div style="text-align:center;">
    <div style="color: var(--text-dim); font-size: 14px; margin-bottom: 8px;">You scored</div>
    <div class="score-big" style="font-size: 64px; font-weight: 700; color: var(--accent); line-height: 1;">
      {{ score }}<span style="font-size: 28px; color: var(--text-dim);">/{{ total }}</span>
    </div>
    <div style="color: var(--text-dim); margin: 8px 0 32px;">{{ percent }}% correct</div>
    <a href="{{ url_for('main.home') }}" class="btn">Play again</a>
  </div>
{% endblock %}
