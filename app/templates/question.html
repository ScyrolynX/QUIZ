{% extends "base.html" %}
{% block title %}Question {{ current_number }}{% endblock %}
{% block content %}
  <div style="display:flex; gap:4px; margin-bottom: 24px;">
    {% for i in range(total) %}
      <div style="flex:1; height:6px; border-radius:3px;
        background: {{ 'var(--accent)' if i < current_number else 'var(--border)' }};"></div>
    {% endfor %}
  </div>

  <div class="num" style="color: var(--text-dim); font-size: 14px; margin-bottom: 8px;">
    Question {{ current_number }} of {{ total }}
  </div>
  <h2 style="font-size: 22px; line-height: 1.4; margin: 0 0 28px;">{{ question.text }}</h2>

  <form method="post" action="{{ url_for('main.question') }}">
    <input type="hidden" name="question_id" value="{{ question.id }}">
    {% for opt in options %}
      <button type="submit" name="answer" value="{{ opt }}" class="option"
        style="display:block; width:100%; text-align:left; background: var(--surface-hover);
        color: var(--text); border: 1px solid var(--border); border-radius: 10px;
        padding: 14px 16px; margin-bottom: 10px; font-family: 'Inter', sans-serif;
        font-size: 15px; cursor: pointer;">
        {{ opt }}
      </button>
    {% endfor %}
  </form>
{% endblock %}
