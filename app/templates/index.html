{% extends "base.html" %}
{% block title %}Quiz{% endblock %}
{% block content %}
  <h1 style="font-size: 32px; margin: 0 0 8px;">Think fast.</h1>
  <p style="color: var(--text-dim); margin: 0 0 32px; line-height: 1.5;">
    A quick round of general knowledge. Pick a category or run the full mix.
  </p>

  <form action="{{ url_for('main.start') }}" method="get">
    <label for="category" style="display:block; font-size: 14px; color: var(--text-dim); margin-bottom: 8px;">
      Category
    </label>
    <select name="category" id="category" style="width:100%; padding:12px 14px; margin-bottom:24px;
      background: var(--surface-hover); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 15px;">
      <option value="all">All categories</option>
      {% for c in categories %}
        <option value="{{ c }}">{{ c|capitalize }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn">Start quiz</button>
  </form>
{% endblock %}
