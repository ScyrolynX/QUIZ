<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Quiz{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #13141C;
    --surface: #1C1E29;
    --surface-hover: #262838;
    --text: #EDEEF2;
    --text-dim: #8A8D9C;
    --accent: #FFB020;
    --correct: #4ADE80;
    --incorrect: #F87171;
    --border: #2C2F3E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1, h2, .num, .score-big {
    font-family: 'Space Grotesk', sans-serif;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
  }
  a { color: inherit; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #13141C;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    text-decoration: none;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    width: 100%;
    text-align: center;
  }
  .btn:hover { background: #ffc450; }
  .btn:focus-visible, .option:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise .35s ease-out; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
